  pl:[{id:0,name:cleanName(name),rtt:0,m:1,q:[],alive:1,send:o=>{if(o.t=='s')onMsg(o);else setTimeout(()=>onMsg(o),0)}}]};
 HS.iv=setInterval(hsTick,4);HS.pg=setInterval(()=>{if(HS)HS.pl.slice(1).forEach(c=>c.send({t:'sp',n:Date.now()}))},500)}
function hsLobby(){const h=HS;if(!h||h.ph!='lobby')return;const names=h.pl.map(c=>c.name||'…');
 h.pl.forEach((c,i)=>c.send({t:'lobby',code:h.code,n:h.pl.length,N:h.N,names,idx:i,host:i==0}));
 if(h.pl.length==h.N&&h.pl.every(c=>c.name)){ON.sg&&ON.sg.close();hsDraft()}}
function hsDraft(){const h=HS;h.g++;h.ph='draft';h.tm=[null,null];h.bs=[null,null];h.nx=[];h.E=null;
 h.pl.forEach((c,i)=>{if(i<2)c.send({t:'draft',code:h.code,idx:i,g:h.g,wins:h.wins,cap:1});else c.send({t:'wait2',g:h.g,cap:h.pl[i%2].name})})}
function hsMsg(c,m){const h=HS;if(!h||!m)return;const i=h.pl.indexOf(c);
 switch(m.t){
 case'name':if(i>0&&!c.name){c.name=cleanName(m.name);hsLobby()}break;
 case'sq':{const d=Date.now()-m.n;if(i>0&&d>=0&&d<5000){c.rtt=c.m?c.rtt*.7+d*.3:d;c.m=1;hsRtt()}break}
 case'team':{if(i>1||h.ph!='draft'||h.tm[i])return;const names=Array.isArray(m.team)?m.team.map(String):[],roles=Array.isArray(m.roles)?m.roles.map(String):[];
  if(names.length!=4||!Object.values(FORMS).some(f=>f.join()==roles.join())||!names.every(n=>h.byName.has(n))||new Set(names).size!=4)return c.send({t:'err',m:'Time inválido'});
  h.tm[i]={name:c.name,team:names,roles,style:['def','eq','of'].includes(m.style)?m.style:'eq'};
  if(h.tm[0]&&h.tm[1]){h.ph='foe';[0,1].forEach(k=>h.pl[k].send({t:'foe',team:h.tm[1-k].team}));h.pl.slice(2).forEach(p=>p.send({t:'wait2',g:h.g,cap:'os capitães'}))}else c.send({t:'wait'});break}
 case'bs':{if(i>1||h.ph!='foe'||h.bs[i]||!Array.isArray(m.bs)||m.bs.length!=4)return;h.bs[i]=m.bs.map(v=>Math.max(-40,Math.min(40,+v||0)));if(h.bs[0]&&h.bs[1])hsMatch();break}
 case'in':case'pw':case'sw':{if(h.ph!='play')return;const mx=Math.max(...h.pl.map(p=>p.rtt)),d=c.m?Math.min(60,Math.max(0,(mx-c.rtt)/2)):0;c.q.push({t:m.t,x:Math.sign(+m.x||0),y:Math.sign(+m.y||0),k:+m.k?1:0,due:Date.now()+(d>6?d:0)});if(c.q.length>200)c.q.shift();break}
 case'next':{if(h.ph!='post')return;h.nx[i]=1;if(h.pl.every((_,k)=>h.nx[k]))hsDraft();break}}}
function hsRtt(){const h=HS,mx=Math.max(...h.pl.map(p=>p.rtt)),list=h.pl.map(c=>({n:c.name,ms:Math.round(c.rtt)}));
 h.pl.forEach((c,i)=>{const d=Math.min(60,Math.max(0,(mx-c.rtt)/2));c.send({t:'rtt',lat:c.rtt+2*d,ping:i?Math.round(c.rtt):-1,list})});}
function hsMatch(){const h=HS,E=HXCmake(),red=h.g%2?0:1,blue=1-red;
 const T=k=>({name:h.tm[k].name,names:h.tm[k].team,team:h.tm[k].team.map(n=>h.byName.get(n)),roles:h.tm[k].roles,style:h.tm[k].style,bs:h.bs[k]});
 const R_=T(red),B=T(blue),Ts=[T(0),T(1)];
 const hs=h.pl.map((c,i)=>{const ti=i%2,t=Ts[ti],field=t.team.map((cd,j)=>({j,s:(t.roles[j]=='ATA'?cd.a:t.roles[j]=='VOL'?cd.v:cd.g)+t.bs[j]})).filter(x=>t.roles[x.j]!='GK').sort((a,b)=>b.s-a.s),k=h.pl.filter((_,q)=>q%2==ti&&q<i).length;
  return{team:ti==red?'red':'blue',idx:field[Math.min(k,field.length-1)].j}});
 E.cfg.TIME=h.cfg.time*60;E.cfg.SL=h.cfg.goals;E.init(R_,B,hs,.9,.9);h.E=E;h.red=red;h.ph='count';h.cd=180;h.acc=0;h.last=Date.now();h.pl.forEach(c=>c.q=[]);
 const lab=ti=>h.pl.filter((_,q)=>q%2==ti).map(c=>c.name).join(' + '),pub=t=>({name:t.name,team:t.names,roles:t.roles,style:t.style,bs:t.bs});
 h.pl.forEach((c,i)=>c.send({t:'go',g:h.g,wins:h.wins,side:(i%2)==red?'red':'blue',hid:i,R:pub(R_),B:pub(B),names:[lab(red),lab(blue)],cfg:h.cfg}));hsRtt()}
function hsEnd(){const h=HS,res=h.E.result(),w=res.win?h.red:1-h.red;h.wins[w]++;const done=h.wins[w]>=2||h.g>=3;h.ph='post';h.E=null;
 h.pl.forEach(c=>c.send({t:'end',res,red:h.red,winner:w,wins:h.wins,series:done?w:-1,g:h.g}))}
function hsTick(){const h=HS;if(!h||!h.E)return;const E=h.E,now=Date.now();h.acc+=Math.min(now-h.last,100);h.last=now;let n=0;
 while(h.acc>=1000/60){h.acc-=1000/60;n++;
  h.pl.forEach((c,i)=>{while(c.q.length&&c.q[0].due<=now){const m=c.q.shift();if(m.t=='in')E.setIn(i,m.x,m.y,m.k);else if(m.t=='pw')E.pw(i);else E.swit(i)}});
  if(h.ph=='count'){if(--h.cd<=0)h.ph='play'}else{E.step();if(E.g().st=='end'&&E.g().endT>150){hsEnd();return}}}
 if(n){const p=E.pack();if(h.ph=='count')p.m=String(Math.ceil(h.cd/60));h.pl.forEach(c=>c.send({t:'s',d:p}))}}
// ---------- cliente (anfitrião e convidados usam o mesmo) ----------
function onMsg(m){if(!ON)return;
 switch(m.t){
 case'sp':ON.send({t:'sq',n:m.n});break;
 case'rtt':ON.lat=m.lat;ON.ping=m.ping;ON.ptxt=m.list.map(x=>esc(x.n)+' '+(x.ms?x.ms+' ms':'host')).join(' · ');break;
 case's':ON.snap={m:m.d,t:performance.now()};break;
 case'err':toast(m.m);break;
 case'lobby':ON.hid=m.idx;ON.tm=m.idx%2;ON.N=m.N;lobbyScr(m);break;
 case'wait2':R(`<h1>⏳ Aguardando…</h1><p class=mut>Partida ${m.g} de 3 · ${esc(m.cap)} está montando o time. Quando estiver pronto você entra em campo.</p>`);break;
 case'left':HX.stop();ON.done=1;try{ON.L&&ON.L.close()}catch(e){}if(HS){clearInterval(HS.iv);clearInterval(HS.pg);HS=null}ON=null;onl('Alguém saiu da partida (ou a conexão caiu).');break;
 case'draft':ON.wins=m.wins;start();S.online=1;toast('Partida '+m.g+' de 3 · você é o capitão: monte o time!');break;
 case'foe':{const foe=m.team.map(n=>P.find(p=>p.n==n)),me=mk(S.team,S.roles,S.style,'Você',foe);ON.send({t:'bs',bs:me.bs.map(v=>+v||0)});break}
 case'go':{const T=t=>({name:t.name,team:t.team.map(n=>P.find(p=>p.n==n)),roles:t.roles,style:t.style,bs:t.bs}),E=HXCmake();E.init(T(m.R),T(m.B),[],.9,.9);ON.snap=null;ON.side=m.side;ON.hid=m.hid;ON.tm=m.hid%2;
  SND.whistle();HX.online(E,m.hid,m.names,ON.net);break}
 case'end':{HX.stop();const won=m.winner==ON.tm,mine=ON.side=='red'?m.res.g[0]:m.res.g[1],theirs=ON.side=='red'?m.res.g[1]:m.res.g[0],w=m.wins;ON.wins=w;SND[won?'win':'lose']();
  R(`<h1>${won?'✅ Seu time venceu a partida!':'❌ Seu time perdeu a partida'}</h1><div class=score><span>Seu time</span><b>${mine} x ${theirs}</b><span>Rival</span></div>${m.res.ot?'<p class=mut>⏱️ Decidido no OVERTIME.</p>':''}<div class=box>Série (melhor de 3): <b>${w[ON.tm]} x ${w[1-ON.tm]}</b></div>`+(m.series>=0?`<h2>${m.series==ON.tm?'🏆 Seu time venceu a série!':'Seu time perdeu a série'}</h2><button class=btn onclick="onlQuit()">Voltar ao menu</button>`:`<button class=btn onclick="ON.send({t:'next'});R('<h1>⏳ Aguardando os outros jogadores…</h1><p class=mut>Quando todos confirmarem, começa a próxima partida.</p>')">Próxima partida</button>`));break}}}
function oReady(){ON.send({t:'team',team:S.team.map(p=>p.n),roles:S.roles.slice(),style:S.style});R('<h1>⏳ Aguardando o rival…</h1><p class=mut>O outro capitão ainda está montando o time.</p>')}

try{['bazinga_carreira_v1','bazinga_treinador_v1'].forEach(k=>localStorage.removeItem(k))}catch(e){}
home();
